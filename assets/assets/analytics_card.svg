<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <style>
      .num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #00d2ff; text-anchor: middle; }
      .lbl { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #00c9a7; text-anchor: middle; }
      .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      .streakNum { font-family: 'Segoe UI', Arial, sans-serif; font-size: 40px; font-weight: 800; fill: #00d2ff; text-anchor: middle; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="216" rx="14" fill="#0d1117" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Total Contributions -->
  <text x="180" y="95" class="num">232</text>
  <text x="180" y="128" class="lbl">Total Contributions</text>
  <text x="180" y="150" class="sub">Sep 2023 - Present</text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="180" stroke="#30363d" stroke-width="1.5"/>

  <!-- Current Streak (flame ring) -->
  <circle cx="450" cy="95" r="46" fill="none" stroke="#21262d" stroke-width="7"/>
  <circle cx="450" cy="95" r="46" fill="none" stroke="#00c9a7" stroke-width="7"
          stroke-dasharray="289" stroke-dashoffset="72" stroke-linecap="round"
          transform="rotate(-90 450 95)"/>
  <text x="450" y="90" font-size="22" text-anchor="middle">🔥</text>
  <text x="450" y="112" class="streakNum" font-size="26">11</text>
  <text x="450" y="160" class="lbl">Current Streak</text>
  <text x="450" y="180" class="sub">days</text>

  <!-- divider -->
  <line x1="540" y1="40" x2="540" y2="180" stroke="#30363d" stroke-width="1.5"/>

  <!-- Longest Streak -->
  <text x="720" y="95" class="num">37</text>
  <text x="720" y="128" class="lbl">Longest Streak</text>
  <text x="720" y="150" class="sub">days</text>
</svg>
